<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SFR TEST WEBSITE - Auth</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="container">
    <div class="form-wrapper">
      <!-- Forms Container -->
      <div class="form-box login" id="loginBox">
        <h2>Welcome Back</h2>
        <p>Login to your account</p>
        <div id="loginMessage" class="message"></div>
        <form id="loginForm">
          <div class="input-group">
            <label for="loginEmail">Email</label>
            <input type="email" id="loginEmail" required placeholder="name@example.com">
          </div>
          <div class="input-group">
            <label for="loginPassword">Password</label>
            <input type="password" id="loginPassword" required placeholder="••••••••">
          </div>
          <button type="submit" class="btn primary-btn" id="loginBtn">Login</button>
        </form>
        
        <div class="divider">
          <span>OR</span>
        </div>
        
        <div class="social-buttons">
          <button class="btn social-btn google-btn" id="loginGoogleBtn">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google"> Login with Google
          </button>
          <button class="btn social-btn facebook-btn" id="loginFacebookBtn">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/facebook.svg" alt="Facebook"> Login with Facebook
          </button>
        </div>

        <p class="switch-form">Don't have an account? <a href="#" id="showRegister">Register here</a></p>
      </div>

      <div class="form-box register hidden" id="registerBox">
        <h2>Create Account</h2>
        <p>Join SFR TEST WEBSITE</p>
        <div id="registerMessage" class="message"></div>
        <form id="registerForm">
          <div class="name-group">
            <div class="input-group">
              <label for="regFirstName">First Name</label>
              <input type="text" id="regFirstName" required placeholder="John">
            </div>
            <div class="input-group">
              <label for="regLastName">Last Name</label>
              <input type="text" id="regLastName" required placeholder="Doe">
            </div>
          </div>
          <div class="input-group">
            <label for="regEmail">Email</label>
            <input type="email" id="regEmail" required placeholder="name@example.com">
          </div>
          <div class="input-group">
            <label for="regPassword">Password</label>
            <input type="password" id="regPassword" required placeholder="••••••••" minlength="6">
          </div>
          <div class="input-group">
            <label for="regConfirmPassword">Confirm Password</label>
            <input type="password" id="regConfirmPassword" required placeholder="••••••••" minlength="6">
          </div>
          <div class="checkbox-group">
            <input type="checkbox" id="termsCheck" required>
            <label for="termsCheck">I agree to the <a href="#">Terms and Conditions</a></label>
          </div>
          <button type="submit" class="btn primary-btn" id="registerBtn">Register</button>
        </form>
        
        <div class="divider">
          <span>OR</span>
        </div>
        
        <div class="social-buttons">
          <button class="btn social-btn google-btn" id="registerGoogleBtn">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google"> Sign up with Google
          </button>
          <button class="btn social-btn facebook-btn" id="registerFacebookBtn">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/facebook.svg" alt="Facebook"> Sign up with Facebook
          </button>
        </div>

        <p class="switch-form">Already have an account? <a href="#" id="showLogin">Login here</a></p>
      </div>
      
    </div>
  </div>

  <script type="module" src="firebase_config.js"></script>
  <script type="module" src="auth.js"></script>
</body>
</html>
